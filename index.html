<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana VIP Turnover & Rakeback Calculator</title>
    <style>
        body { background-color: #0b0b0e; color: #e4e4e7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 15px; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { max-width: 440px; width: 100%; background: #13131a; padding: 25px; border-radius: 16px; border: 1px solid #27272a; box-shadow: 0 10px 30px rgba(0,0,0,0.7); box-sizing: border-box; }
        h2 { color: #00ffcc; margin-top: 0; margin-bottom: 20px; font-size: 22px; letter-spacing: -0.5px; }
        label { display: block; text-align: left; margin: 12px 0 6px; font-size: 14px; font-weight: 600; color: #a1a1aa; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #3f3f46; background: #1c1c24; color: #fff; box-sizing: border-box; font-size: 16px; outline: none; }
        input:focus { border-color: #00ffcc; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #00ffcc, #00b3ff); border: none; border-radius: 8px; color: #09090b; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        .result-box { margin-top: 20px; padding: 15px; background: #1c1c24; border-left: 4px solid #00ffcc; border-radius: 6px; text-align: left; }
        .result-line { margin: 8px 0; font-size: 14px; color: #d4d4d8; }
        .highlight { color: #00ffcc; font-weight: 700; float: right; }
        .promo-btn { display: block; width: 100%; text-align: center; margin-top: 25px; padding: 14px; background: linear-gradient(135deg, #a855f7, #ec4899); color: #fff; text-decoration: none; font-weight: 700; border-radius: 8px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(236,72,153,0.3); font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ SOL VIP Farm Calculator</h2>
    
    <label for="wager">Target Turnover Volume (SOL):</label>
    <input type="number" id="wager" value="100" min="1">

    <label for="winChance">Dice Win Chance (%):</label>
    <input type="number" id="winChance" value="98" min="1" max="98">

    <label for="houseEdge">Base House Edge (%):</label>
    <input type="number" id="houseEdge" value="1" step="0.1">

    <button onclick="calculateVIP()">Analyze Turnover Strategy</button>

    <div class="result-box">
        <div class="result-line">Expected Variance Loss: <span id="loss" class="highlight">0.0000 SOL</span></div>
        <div class="result-line">Instant Rakeback (Gold III baseline): <span id="rakeback" class="highlight">0.0000 SOL</span></div>
        <div class="result-line">Race Points Earned: <span id="points" class="highlight">0</span></div>
    </div>

    <a https://nuts.gg/play/Kfc1FN1J target="_blank" class="promo-btn">🚀 Deploy Strategy Natively on Nuts.gg</a>
</div>

<script>
function calculateVIP() {
    let wager = parseFloat(document.getElementById('wager').value) || 0;
    let houseEdge = (parseFloat(document.getElementById('houseEdge').value) || 1) / 100;

    let expectedLoss = wager * houseEdge;
    let baseRakebackRate = 0.16712; 
    let estimatedRakeback = expectedLoss * baseRakebackRate;
    let racePoints = wager * 10;

    document.getElementById('loss').innerText = expectedLoss.toFixed(4) + " SOL";
    document.getElementById('rakeback').innerText = estimatedRakeback.toFixed(4) + " SOL";
    document.getElementById('points').innerText = Math.floor(racePoints).toLocaleString();
}</script>

</body>
</html>
